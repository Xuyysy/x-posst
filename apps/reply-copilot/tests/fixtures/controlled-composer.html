<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reply Copilot 受控编辑器测试页</title>
  <style>
    :root { font: 16px/1.55 system-ui, sans-serif; color: #202329; background: #f4f5f7; }
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; }
    main { padding: 26px; border: 1px solid #d9dde5; border-radius: 16px; background: white; }
    .editor { min-height: 120px; margin: 16px 0; padding: 14px; border: 1px solid #9ba3af; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .editor:focus { outline: 3px solid #9bbcff; border-color: #3975db; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button { padding: 9px 12px; border: 0; border-radius: 8px; background: #e7eaf0; font: inherit; cursor: pointer; }
    output, .note { display: block; margin-top: 14px; color: #626b78; overflow-wrap: anywhere; }
    code { background: #eef0f4; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>受控编辑器测试页</h1>
    <p>这是一个本地模拟页：输入事件会更新内部状态，“模拟框架重渲染”会从内部状态恢复编辑器显示。它用于检查普通粘贴、编辑、删除和重渲染是否一致，不能代替真实 X 页面验证。</p>
    <label for="composer">模拟 X 回复框</label>
    <div id="composer" class="editor" contenteditable="true" role="textbox" aria-label="模拟 X 回复框" data-testid="tweetTextarea_0"></div>
    <div class="actions">
      <button id="render" type="button">模拟框架重渲染</button>
      <button id="reset" type="button">清空测试状态</button>
    </div>
    <output id="state">内部状态：空 · 字数：0</output>
    <p class="note">请在编辑框中粘贴测试文字，尝试中间插入、Backspace、Delete、⌘A 后删除、换行和末尾输入；再点“模拟框架重渲染”，确认显示和内部状态一致。</p>
  </main>
  <script>
    const editor = document.querySelector("#composer");
    const state = document.querySelector("#state");
    let model = "";
    function renderState() {
      state.textContent = `内部状态：${model || "空"} · 字数：${model.length}`;
    }
    editor.addEventListener("input", () => {
      model = editor.innerText.replace(/\u00a0/g, " ");
      renderState();
    });
    document.querySelector("#render").addEventListener("click", () => {
      editor.replaceChildren(document.createTextNode(model));
      renderState();
    });
    document.querySelector("#reset").addEventListener("click", () => {
      model = "";
      editor.replaceChildren();
      renderState();
      editor.focus();
    });
    renderState();
  </script>
</body>
</html>
