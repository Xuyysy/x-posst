<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>欢迎使用 Reply Copilot</title><link rel="stylesheet" href="onboarding.css"></head><body><main><p class="brand">REPLY COPILOT · 本地测试版</p><div class="steps"><span class="active">1</span><span>2</span><span>3</span></div>
<section data-step="0"><h1>写出更像你自己的回复。</h1><p>不用切换页面，也能用自己的语气自然地参与 X 讨论。</p><ul><li>自然表达</li><li>定制个人风格</li><li>由你掌控发送</li></ul><p class="muted">Reply Copilot 只提供草稿。由你检查、编辑，并决定是否发送。</p><button data-next>开始设置</button></section>
<section data-step="1" class="hidden"><h1>设置你的风格</h1><p>选择几项偏好，之后也可以在设置中心修改。</p><label>基础语气<select id="tone"><option value="relaxed_friendly">轻松友好</option><option value="balanced_thoughtful">平和有思考</option><option value="confident_direct">自信直接</option></select></label><label>回复语言<select id="language"><option value="auto">自动识别</option><option value="zh">中文</option><option value="en">English</option></select></label><label>回复长度<select id="length"><option value="short">简短</option><option value="medium">适中</option><option value="adaptive" selected>自适应</option></select></label><label>幽默程度<select id="humor"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label><div class="actions"><button class="secondary" data-back>上一步</button><button data-next>继续</button><button class="text" data-skip>跳过</button></div></section>
<section data-step="2" class="hidden"><h1>连接 AI 服务</h1><p>本地测试版需要你自己的 DeepSeek API Key。未来托管版本无需用户自行配置 Key。</p><label>DeepSeek API Key<input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴你的 API Key"></label><div class="actions"><button id="save-key" class="secondary">保存 Key</button><button id="test-key" class="secondary">测试连接</button></div><p id="status" class="muted" role="status"></p><p class="muted">Key 保存在此浏览器的扩展本地存储中。本地存储不等于服务器端密钥保护。</p><div class="actions"><button class="secondary" data-back>上一步</button><button id="finish">完成设置</button><button class="text" data-skip>稍后再说</button></div></section>
<footer><a href="../options/options.html">打开完整设置中心</a></footer></main><script type="module" src="onboarding.js"></script></body></html>
