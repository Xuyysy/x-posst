name: X Auto Poster

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Trigger source"
        required: false
        default: "manual"

concurrency:
  group: x-auto-poster
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger diagnostics
        run: |
          echo "event=${{ github.event_name }}"
          echo "trigger_source=${{ inputs.trigger_source }}"
          echo "ref=${{ github.ref }}"
          echo "default_branch=${{ github.event.repository.default_branch }}"
          date
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e .
      - name: Decrypt posts into runner temporary directory
        env:
          POSTS_ENCRYPTION_KEY: ${{ secrets.POSTS_ENCRYPTION_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/x-auto-poster"
          python scripts/decrypt_posts.py \
            --input data/posts.enc.json \
            --output "$RUNNER_TEMP/x-auto-poster/posts.json"
          echo "POSTS_FILE_PATH=$RUNNER_TEMP/x-auto-poster/posts.json" >> "$GITHUB_ENV"
      - name: Run publisher
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m x_auto_poster.main
      - name: Remove temporary plaintext
        if: always()
        run: rm -f "$RUNNER_TEMP/x-auto-poster/posts.json"
      - name: Commit state when changed
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if ! git diff --quiet -- data/state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: update auto poster state"
            git fetch origin "$BRANCH_NAME"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi
